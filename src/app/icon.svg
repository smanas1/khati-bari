<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)"/>
  <rect width="120" height="120" x="4" y="4" rx="28" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.4"/>
  
  <!-- Organic Leaf -->
  <g filter="url(#shadow)">
    <!-- Main leaf body -->
    <path d="M36 92 C 34 60, 56 36, 92 32 C 92 68, 68 90, 36 92 Z" fill="url(#leafGrad)"/>
    <!-- Center stem vein -->
    <path d="M36 92 C 52 76, 68 60, 92 32" stroke="#064e3b" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Side branch veins -->
    <path d="M50 78 C 60 74, 68 76, 72 80" stroke="#064e3b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M64 64 C 74 58, 80 58, 86 60" stroke="#064e3b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
  
  <!-- Golden Sparkle / Star Badge at top right -->
  <g transform="translate(92, 34)">
    <circle cx="0" cy="0" r="15" fill="#022c22" stroke="#f59e0b" stroke-width="2"/>
    <path d="M0 -9 C 1 -3.5, 3.5 -1, 9 0 C 3.5 1, 1 3.5, 0 9 C -1 3.5, -3.5 1, -9 0 C -3.5 -1, -1 -3.5, 0 -9 Z" fill="url(#sparkleGrad)"/>
  </g>
</svg>
